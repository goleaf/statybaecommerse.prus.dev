# GitHub Actions workflow to run Laravel tests with Composer, SQLite, and JUnit logging.
name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Restrict the Laravel test matrix to the single supported PHP version.
        php: ['8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy environment file
        run: cp .env.testing .env || true

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/testing.sqlite

      - name: Run database migrations
        run: php artisan migrate --env=testing --database=sqlite

      - name: Run test suite with JUnit logging
        run: php artisan test --env=testing --log-junit=storage/logs/junit-${{ matrix.php }}.xml

      - name: Upload JUnit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-php-${{ matrix.php }}
          path: storage/logs/junit-${{ matrix.php }}.xml
          if-no-files-found: warn

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: storage/logs/junit-${{ matrix.php }}.xml

  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-phpstan-
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-pint-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-pint-
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test
