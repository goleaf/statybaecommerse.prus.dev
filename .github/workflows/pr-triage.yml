name: PR Triage and Merges
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pr-triage.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Execute triage and merges
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const core = require('@actions/core');

            async function commentIssue(number, body) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

            async function closePR(number, body) {
              try {
                await commentIssue(number, body);
              } catch (e) {
                core.warning(`Comment failed for #${number}: ${e.message}`);
              }
              try {
                await github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed' });
                core.info(`Closed #${number}`);
              } catch (e) {
                core.warning(`Close failed for #${number}: ${e.message}`);
              }
            }

            async function mergePR(number) {
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash' });
                core.info(`Merged #${number}`);
              } catch (e) {
                core.warning(`Merge failed for #${number}: ${e.message}`);
              }
            }

            const mainClose = "Closing: Filament v4 expects Form/Table (and Form::schema) signatures, not Schema. See #1051 review for details. Please rework against Form/Table and reopen if needed.";

            // 1) Close Schema-signature PRs (explicit)
            const explicitClose = [1051, 1046];
            for (const n of explicitClose) {
              await closePR(n, mainClose);
            }

            // Also search for Oct 20–21 (2025) schema PRs mentioning Filament
            try {
              const q = `repo:${owner}/${repo} is:pr is:open created:2025-10-20..2025-10-21 schema filament`;
              const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 100 });
              for (const item of res.data.items) {
                await closePR(item.number, mainClose);
              }
            } catch (e) {
              core.warning(`Search failed: ${e.message}`);
            }

            // 2) Merge "ready" PRs in order (squash): 951 -> 950 -> 916 -> 918
            for (const n of [951, 950, 916, 918]) {
              await mergePR(n);
            }

            // 3) Needs small fix -> post comment guidance
            await commentIssue(1038, "Please add a single, rate-limited warning when falling back to full cache flush: Log::warning('Cache tags unavailable; performing full cache flush', ['area' => 'catalog','reason' => 'no_tags']). Merge after adding.");
            await commentIssue(1035, "Verify sequencing after other workflow merges and ensure CI is green. Merge once CI passes.");
            await commentIssue(1045, "OK once Schema-signature PRs are closed so the suite runs. Merge after closures.");

            // 4) Keep open — targeted follow-ups
            await commentIssue(1031, "Hooks source the env twice causing early exits. Source once and chain commands (set -euo pipefail; . \"$(dirname \"$0\")/_/husky.sh\"; cmd1 && cmd2).");
            await commentIssue(1011, "Relax overly narrow types so existing resources compile; add one integration test.");
            await commentIssue(1048, "Rework against proper Form signature and re-run pagination tests (Schema drift was rejected).");
            await commentIssue(784,  "Verify plugin registration + persistence migration in dev; then merge.");
            await commentIssue(785,  "Verify package config and Tailwind content paths; resolve unrelated PHPStan noise.");
            await commentIssue(789,  "Overlap with #1011; rebase on it or close in favor.");
            await commentIssue(798,  "Double-check min/max defaults and reactive totals in Order/Cart repeaters, then merge.");
            await commentIssue(938,  "Keep; will compile after standardizing on Form; re-run after cleanup.");
            await commentIssue(765,  "Correct direction (uses Form). Fix unrelated failing tests (AuthorizationMatrixTest, etc.) or split.");

