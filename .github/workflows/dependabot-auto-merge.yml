name: Dependabot PR Management

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  label-and-automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure labels exist
        uses: peter-evans/create-or-update-label@v4
        with:
          name: dependencies
          description: Dependencies updates
          color: 0E8A16

      - name: Ensure automerge label exists
        uses: peter-evans/create-or-update-label@v4
        with:
          name: automerge
          description: Automatically merge when checks succeed
          color: 1D76DB

      - name: Apply dependencies label
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label "dependencies"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply automerge label for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label "automerge"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
