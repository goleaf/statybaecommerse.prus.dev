name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel superseded workflow runs so developers get feedback from the latest commit only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  build:
    # Matrix-driven job keeps PHP checks consistent across supported versions.
    name: PHP ${{ matrix.php-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, bcmath, pcntl
          coverage: xdebug
          ini-values: |
            memory_limit=1G
            error_reporting=E_ALL
            log_errors=On

      - name: Setup Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Run Pint (fail on drift)
        run: composer lint:php

      - name: Run PHPStan analysis
        run: composer analyse

      - name: Prepare build directory
        run: mkdir -p build

      - name: Run tests with coverage
        env:
          XDEBUG_MODE: coverage
        run: >-
          # Capture coverage per PHP version to retain debugging context.
          composer test -- --coverage-clover build/coverage-${{ matrix.php-version }}.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: build/coverage-${{ matrix.php-version }}.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint (fail on drift)
        run: npx --yes eslint@9 . --max-warnings=0

      - name: Build frontend assets
        run: npm run build
