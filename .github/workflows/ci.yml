name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare directories
        run: |
          mkdir -p build
          mkdir -p storage/app/coverage

      - name: Generate API specification
        run: php artisan api:spec

      - name: Ensure OpenAPI spec is committed
        run: |
          git diff -- public/openapi.json public/openapi.yaml
          git diff --exit-code -- public/openapi.json public/openapi.yaml || \
            (echo "::error::OpenAPI spec files are out of date. Run 'php artisan api:spec' locally and commit the changes." && exit 1)

      - name: Upload OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: |
            public/openapi.json
            public/openapi.yaml

      - name: Run test suite
        run: composer test:ci

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/junit.xml

      - name: Upload junit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-junit
          path: build/junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-coverage
          path: build/coverage.xml

  php-compat:
    name: PHP Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHP 9 readiness doctor
        run: php artisan app:doctor --no-interaction
