name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJson((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]') ? '["8.2","8.3"]' : '["8.3"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  php-compat:
    name: PHP Compatibility (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJson((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]') ? '["8.2","8.3"]' : '["8.3"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHP 9 readiness doctor
        run: php artisan app:doctor --no-interaction
