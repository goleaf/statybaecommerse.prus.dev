name: Full CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJSON(github.event_name == 'pull_request' && startsWith(github.actor, 'renovate') ? '["8.2","8.3"]' : '["8.3"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify migrations are frozen
        run: php scripts/check-frozen-migrations.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application environment
        run: |
          DB_PATH="${GITHUB_WORKSPACE}/database/database.sqlite"
          cat <<EOF > .env
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_LOCALE=lt
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlite
          DB_DATABASE=${DB_PATH}
          BROADCAST_DRIVER=log
          CACHE_DRIVER=array
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_LIFETIME=120
          MAIL_MAILER=log
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_ENCRYPTION=null
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="Laravel"
          EOF
          touch "${DB_PATH}"
          php artisan key:generate
          touch database/database.sqlite

      - name: Run database migrations
        run: php artisan migrate --no-interaction --force

      - name: Run database migrations and seeds
        run: php artisan migrate:fresh --seed --force

      - name: Generate API specification
        run: php artisan api:spec

      - name: Ensure OpenAPI spec is committed
        run: |
          git diff -- public/openapi.json public/openapi.yaml
          git diff --exit-code -- public/openapi.json public/openapi.yaml || \
            (echo "::error::OpenAPI spec files are out of date. Run 'php artisan api:spec' locally and commit the changes." && exit 1)

      - name: Upload OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: |
            public/openapi.json
            public/openapi.yaml

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: |
          set +e
          php artisan test --testsuite=Unit --log-junit build/junit-unit.xml
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}

      - name: Run feature tests with coverage
        id: feature-tests
        continue-on-error: true
        run: |
          set +e
          php artisan test --testsuite=Feature --log-junit build/junit-feature.xml --coverage-clover build/coverage.xml
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}

      - name: Evaluate test results
        if: always()
        run: |
          unit_status="${{ steps.unit-tests.outputs.exit_code }}"
          feature_status="${{ steps.feature-tests.outputs.exit_code }}"

          if [ -z "${unit_status}" ]; then
            echo "::error::Unit test suite did not report a status."
            exit 1
          fi

          if [ -z "${feature_status}" ]; then
            echo "::error::Feature test suite did not report a status."
            exit 1
          fi

          if [ "${unit_status}" != "0" ] || [ "${feature_status}" != "0" ]; then
            echo "::error::One or more Laravel test suites failed."
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        with:
          files: |
            build/junit-unit.xml
            build/junit-feature.xml

      - name: Upload junit reports
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit
          path: |
            build/junit-unit.xml
            build/junit-feature.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-coverage
          path: build/coverage.xml

  php-compat:
    name: "PHP Compatibility (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    needs: phpunit
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application environment
        run: |
          DB_PATH="${GITHUB_WORKSPACE}/database/database.sqlite"
          cat <<EOF > .env
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_LOCALE=lt
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlite
          DB_DATABASE=${DB_PATH}
          BROADCAST_DRIVER=log
          CACHE_DRIVER=array
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_LIFETIME=120
          MAIL_MAILER=log
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_ENCRYPTION=null
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="Laravel"
          EOF
          touch "${DB_PATH}"
          php artisan key:generate

      - name: Run PHP 9 readiness doctor
        run: php artisan app:doctor --no-interaction

  docs-size:
    name: Documentation Asset Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure documentation files stay under 2MB
        run: |
          set -euo pipefail
          if [ ! -d docs ]; then
            exit 0
          fi

          # Find any files larger than 2MB inside /docs
          offending_files=$(find docs -type f -size +2M)

          if [ -n "${offending_files}" ]; then
            echo "The following documentation files exceed 2MB:" >&2
            echo "${offending_files}" >&2
            exit 1
          fi
