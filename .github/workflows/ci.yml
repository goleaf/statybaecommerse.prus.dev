name: Full CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  php-tests:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Ensure application environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          elif [ -f .env.terminal-optimized ]; then
            cp .env.terminal-optimized .env
          elif [ -f .env.reports ]; then
            cp .env.reports .env
          else
            touch .env
          fi
          php artisan key:generate
          touch database/database.sqlite

      - name: Run database migrations
        run: php artisan migrate --no-interaction --force

      - name: Generate API specification
        run: php artisan api:spec

      - name: Ensure OpenAPI spec is committed
        run: |
          git diff -- public/openapi.json public/openapi.yaml
          git diff --exit-code -- public/openapi.json public/openapi.yaml || \
            (echo "::error::OpenAPI spec files are out of date. Run 'php artisan api:spec' locally and commit the changes." && exit 1)

      - name: Upload OpenAPI spec artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: |
            public/openapi.json
            public/openapi.yaml

      - name: Run test suite
        run: composer test:ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: coverage.xml

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure documentation files remain below 2 MB
        run: |
          python <<'PY'
from pathlib import Path
import sys

# Guardrail: keep Markdown and ancillary docs below 2 MB so they stay reviewable in Git.
limit_bytes = 2 * 1024 * 1024
violations = []

for path in Path("docs").rglob("*"):
    if not path.is_file():
        continue
    size = path.stat().st_size
    if size > limit_bytes:
        violations.append((path, size))

if violations:
    print("The following documentation files exceed the 2 MB limit:")
    for path, size in violations:
        print(f" - {path} ({size} bytes)")
    sys.exit(1)

# Provide positive feedback to make CI logs easier to parse.
print("All documentation files are below the 2 MB threshold.")
PY

  migration-freeze:
    name: Migration Freeze Guard
    runs-on: ubuntu-latest
    needs: documentation-size
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}"

      - name: Ensure historical migrations remain immutable
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            diff_range="${base_ref}...HEAD"
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              diff_range="HEAD^...HEAD"
            else
              echo "No parent commit to compare against; skipping migration freeze check."
              exit 0
            fi
          fi

          changed_files="$(git diff --name-status ${diff_range} -- database/migrations || true)"

          if [[ -z "${changed_files}" ]]; then
            exit 0
          fi

          violations="$(echo "${changed_files}" | awk '$1 != "A" && $1 != "?" {print $0}')"

          if [[ -n "${violations}" ]]; then
            echo "Detected modifications to existing migration files:"
            echo "${violations}"
            echo "Add a new forward-only migration instead of editing history."
            exit 1
          fi

          echo "Migration freeze check passed."

  php-lint-pint:
    name: PHP Lint & Pint
    runs-on: ubuntu-latest
    needs: migration-freeze
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm ci

      - name: Build frontend assets
        run: npm run build -- --mode=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: php-lint-pint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies for audit
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare npm lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
