# Workflow: clean up local branches when PRs close without merging
name: PR Branch Cleanup

on:
  pull_request:
    types:
      - closed

jobs:
  remove-branch:
    # Only run when the PR is closed without merge and the branch lives in this repo.
    if: >-
      ${{
        !github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref != github.event.repository.default_branch
      }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed pull request branch
        # Use Octokit to remove the stale branch reference safely.
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchRef = `heads/${context.payload.pull_request.head.ref}`;
            core.info(`Removing branch ${branchRef} because the PR closed without merging.`);
            await github.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: branchRef,
            });
