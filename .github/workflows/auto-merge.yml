name: CI + Auto Merge

on:
  pull_request:
    # Monitor events that can change mergeability (status updates, reviews, labels, etc.).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge PR (squash) and delete branch
    runs-on: ubuntu-latest
    # Skip draft pull requests and contributions from forks for safety.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check mergeability via GitHub API
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Fetch the freshest pull request data to avoid stale mergeability flags.
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.info(`PR #${prNumber} mergeable: ${pr.mergeable}; state: ${pr.mergeable_state}`);

            // Expose mergeability details for subsequent steps.
            core.setOutput('mergeable', pr.mergeable ? 'true' : 'false');
            core.setOutput('mergeable_state', pr.mergeable_state || 'unknown');

      - name: Merge pull request when clean
        if: steps.pr.outputs.mergeable == 'true' && steps.pr.outputs.mergeable_state == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Squash-merge the pull request, close it, and delete the source branch when no conflicts exist.
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch \
            --body "Automated merge performed by CI once the pull request became conflict-free."

      - name: Log mergeability status when merge is skipped
        if: steps.pr.outputs.mergeable != 'true' || steps.pr.outputs.mergeable_state != 'clean'
        run: |
          # Provide context in the workflow logs explaining why the merge did not proceed.
          echo "Pull request ${{ github.event.pull_request.number }} mergeable_state=${{ steps.pr.outputs.mergeable_state }}; awaiting clean state."
