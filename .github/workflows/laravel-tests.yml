# Laravel CI workflow to guarantee deterministic PHP test feedback with Composer-installed dependencies.
name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-tests:
    # Run the core Laravel test suite against multiple supported PHP versions.
    name: PHP ${{ matrix.php }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      # Ensure every PHP version in the matrix executes even if an earlier run fails.
      fail-fast: false
      matrix:
        # Focus the matrix on the actively supported PHP runtime for this project.
        php: ["8.3"]
    env:
      # Configure Laravel to rely on lightweight, file-based services for CI speed and determinism.
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout repository
        # Ensure the workflow operates on the latest commit pushed to the branch/PR.
        uses: actions/checkout@v4

      - name: Setup PHP
        # Install the requested PHP version alongside the extensions required by Laravel.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, intl, bcmath, zip, pcntl
          coverage: none

      - name: Cache Composer dependencies
        # Cache the vendor directory to avoid re-downloading Composer packages on every run.
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        # Install Composer dependencies without executing scripts to keep the environment clean.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        # Bootstrap Laravel using SQLite so migrations and tests can execute without external services.
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite

      - name: Run database migrations
        # Apply migrations to the SQLite database to mirror production schema expectations.
        run: php artisan migrate --force --no-interaction

      - name: Run PHPUnit test suite
        # Execute tests with verbose output while exporting a JUnit report for GitHub status integration.
        run: vendor/bin/phpunit --log-junit junit.xml --testdox

      - name: Upload JUnit report
        # Always upload the test report so failing runs still surface structured diagnostics.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.php }}-junit
          path: junit.xml

  phpstan:
    # Keep static analysis isolated so it never blocks the primary test job setup.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        # Execute static analysis using the repository's configuration.
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

  code-style:
    # Validate code style separately so formatting issues surface quickly.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style with Pint
        # Use Laravel Pint in test mode to ensure style consistency without modifying files.
        run: vendor/bin/pint --test
