# Automatically merge pull requests targeting main when they are conflict-free.
name: Auto merge conflict-free pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

# Ensure only a single merge attempt runs per pull request to avoid duplicate merges.
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge conflict-free pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Restrict execution to ready pull requests aimed at main while honouring opt-out and opt-in labels.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      (
        contains(github.event.pull_request.labels.*.name, 'automerge') ||
        github.event.pull_request.user.login == 'goleaf'
      )
    steps:
      - name: Merge pull request when no conflicts remain
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Extract the pull request number from the event payload for lookup.
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed('Pull request context is unavailable.');
              return;
            }

            // Define a helper that pauses execution so GitHub can compute mergeability.
            const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // Poll GitHub for the latest pull request details until mergeability is known.
            let prDetails = null;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              prDetails = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });

              if (prDetails.data.mergeable !== null) {
                core.info(`Mergeability resolved on attempt ${attempt}.`);
                break;
              }

              core.info(`Mergeability unknown on attempt ${attempt}; waiting for GitHub to finish checks.`);
              await pause(5000);
            }

            // Abort early when GitHub reports conflicts, blocked status, or an unknown mergeable state.
            if (!prDetails || prDetails.data.mergeable !== true) {
              core.setFailed('Pull request is not mergeable without conflicts.');
              return;
            }

            // Capture the mergeable state so we only merge when GitHub confirms there are no conflicts in the diff.
            const mergeableState = prDetails.data.mergeable_state;
            const allowedStates = new Set(['clean', 'unstable', 'has_hooks']);

            // Stop execution when GitHub explicitly reports conflicts or branch protection blocks the merge.
            if (!allowedStates.has(mergeableState)) {
              core.setFailed(`Pull request merge blocked because mergeable_state is "${mergeableState}".`);
              return;
            }

            // Merge the pull request using the default method to keep parity with manual merges.
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              merge_method: 'merge',
            });

            // Remove the source branch when it originates from the same repository.
            if (
              prDetails.data.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              prDetails.data.head?.ref
            ) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${prDetails.data.head.ref}`,
                });
                core.info(`Deleted branch ${prDetails.data.head.ref} after successful merge.`);
              } catch (error) {
                core.warning(`Branch deletion skipped: ${error.message}`);
              }
            } else {
              core.info('Branch deletion skipped because the source is a fork.');
            }
