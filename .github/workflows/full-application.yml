name: Full Application Verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  laravel-full-suite:
    name: Full Laravel Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, exif, pcntl, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application environment
        run: |
          DB_PATH="${GITHUB_WORKSPACE}/database/database.sqlite"
          cat <<EOF > .env
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost
          APP_LOCALE=lt
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlite
          DB_DATABASE=${DB_PATH}
          BROADCAST_DRIVER=log
          CACHE_DRIVER=array
          FILESYSTEM_DISK=public
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_LIFETIME=120
          MAIL_MAILER=log
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_ENCRYPTION=null
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="Laravel"
          SCOUT_DRIVER=null
          TELESCOPE_ENABLED=false
          HORIZON_ENABLED=false
          EOF
          touch "${DB_PATH}"
          php artisan key:generate

      - name: Bootstrap storage
        run: |
          php artisan storage:link
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views

      - name: Run database migrations with seeders
        run: php artisan migrate:fresh --seed --force

      - name: Warm application caches (non-blocking in CI)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          # Only build caches outside of testing; route:cache commonly fails with Closure routes.
          if [ "${APP_ENV}" = "production" ]; then
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache  || true
          else
            echo "Skipping config/route/view cache in ${APP_ENV}."
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Run unit tests
        id: full-unit-tests
        continue-on-error: true
        run: |
          set +e
          php artisan test --testsuite=Unit
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}

      - name: Run feature tests
        id: full-feature-tests
        continue-on-error: true
        run: |
          set +e
          php artisan test --testsuite=Feature
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}

      - name: Evaluate test results
        if: ${{ always() && steps.full-unit-tests.conclusion != 'skipped' && steps.full-feature-tests.conclusion != 'skipped' }}
        run: |
          unit_status="${{ steps.full-unit-tests.outputs.exit_code }}"
          feature_status="${{ steps.full-feature-tests.outputs.exit_code }}"
          if [ -z "${unit_status}" ] || [ -z "${feature_status}" ]; then
            echo "::error::Test suites did not run. Check earlier steps (migrations, cache warmup, build)."
            exit 1
          fi
          if [ "${unit_status}" != "0" ] || [ "${feature_status}" != "0" ]; then
            echo "::error::One or more Laravel test suites failed during full verification."
            exit 1
          fi
