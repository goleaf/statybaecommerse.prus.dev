# Dependabot configuration ensures Composer and npm dependencies stay current.
# Weekly cadence keeps noise manageable while still addressing security fixes quickly.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
