components:
  schemas:
    CampaignClick:
      type: object
      required:
        - id
        - campaign_id
        - customer_id
        - click_type
        - clicked_at
      properties:
        id:
          type: integer
          format: int64
        campaign_id:
          type: integer
          format: int64
        campaign:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              format: int64
              nullable: true
            name:
              type: string
              nullable: true
            slug:
              type: string
              nullable: true
        customer_id:
          type: integer
          format: int64
          nullable: true
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              format: int64
              nullable: true
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        session_id:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        click_type:
          type: string
        click_type_label:
          type: string
          nullable: true
        clicked_url:
          type: string
          nullable: true
        clicked_at:
          type: string
          format: date-time
          nullable: true
        referer:
          type: string
          nullable: true
        device_type:
          type: string
          nullable: true
        device_type_label:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        browser_label:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        os_label:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        utm_term:
          type: string
          nullable: true
        utm_content:
          type: string
          nullable: true
        conversion_value:
          type: number
          format: float
          nullable: true
        is_converted:
          type: boolean
        conversion_data:
          type: object
          nullable: true
        conversions_count:
          type: integer
          format: int64
          nullable: true
        total_conversion_value:
          type: number
          format: float
          nullable: true
        conversion_rate:
          type: number
          format: float
          nullable: true
        utm_params:
          type: object
          nullable: true
        location_info:
          type: object
          nullable: true
        device_info:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    CampaignClickCollectionResponse:
      type: object
      required:
        - data
        - meta
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignClick'
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    CampaignClickResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CampaignClick'
        message:
          type: string
          nullable: true
    CampaignClickStatistics:
      type: object
      required:
        - total_clicks
        - converted_clicks
        - conversion_rate
        - total_conversion_value
        - today_clicks
        - this_week_clicks
      properties:
        total_clicks:
          type: integer
          format: int64
        converted_clicks:
          type: integer
          format: int64
        conversion_rate:
          type: number
          format: float
        total_conversion_value:
          type: number
          format: float
        today_clicks:
          type: integer
          format: int64
        this_week_clicks:
          type: integer
          format: int64
    CampaignClickAnalytics:
      type: object
      required:
        - clicks_over_time
        - device_types
        - browsers
        - countries
        - utm_sources
      properties:
        clicks_over_time:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              count:
                type: integer
                format: int64
        device_types:
          type: array
          items:
            type: object
            properties:
              device_type:
                type: string
                nullable: true
              count:
                type: integer
                format: int64
        browsers:
          type: array
          items:
            type: object
            properties:
              browser:
                type: string
                nullable: true
              count:
                type: integer
                format: int64
        countries:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
                nullable: true
              count:
                type: integer
                format: int64
        utm_sources:
          type: array
          items:
            type: object
            properties:
              utm_source:
                type: string
                nullable: true
              count:
                type: integer
                format: int64
    AutocompleteResult:
      type: object
      required:
        - value
        - label
      properties:
        value:
          oneOf:
            - type: string
            - type: integer
        label:
          type: string
        data:
          type: object
          nullable: true
    AutocompleteResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutocompleteResult'
        meta:
          type: object
          properties:
            query:
              type: string
              nullable: true
            total:
              type: integer
              format: int64
            limit:
              type: integer
              format: int64
            type:
              type: string
              nullable: true
            types:
              type: array
              items:
                type: string
              nullable: true
    AutocompleteErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
    AutocompleteSuggestionsResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            popular:
              type: array
              items:
                type: string
            recent:
              type: array
              items:
                type: string
            combined:
              type: array
              items:
                type: string
        meta:
          type: object
          properties:
            limit:
              type: integer
              format: int64
    AutocompleteSearchResult:
      type: object
      required:
        - value
        - label
        - data
      properties:
        value:
          oneOf:
            - type: string
            - type: integer
        label:
          type: string
        data:
          type: object
    AutocompleteSearchResponse:
      type: object
      required:
        - success
        - results
      properties:
        success:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/AutocompleteSearchResult'
    SystemSettingValueMap:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
          - type: object
          - type: 'null'
    SystemSettingEntry:
      type: object
      required:
        - key
        - name
        - value
        - type
        - group
      properties:
        key:
          type: string
        name:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
            - type: object
            - type: 'null'
        type:
          type: string
        group:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        help_text:
          type: string
          nullable: true
    SystemSettingCategory:
      type: object
      required:
        - id
        - name
        - slug
        - settings_count
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        settings_count:
          type: integer
          format: int64
    SystemSettingGroup:
      type: object
      required:
        - name
        - label
        - settings_count
      properties:
        name:
          type: string
        label:
          type: string
        settings_count:
          type: integer
          format: int64
    DiscountConditionSummary:
      type: object
      required:
        - id
        - type
        - operator
        - value
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        type_label:
          type: string
          nullable: true
        operator:
          type: string
        operator_label:
          type: string
          nullable: true
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
            - type: object
            - type: 'null'
        priority:
          type: integer
          format: int64
          nullable: true
        position:
          type: integer
          format: int64
          nullable: true
        description:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
    DiscountConditionCollection:
      type: object
      required:
        - conditions
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/DiscountConditionSummary'
    DiscountConditionTestResponse:
      type: object
      required:
        - matches
        - is_valid
        - condition_description
        - message
      properties:
        matches:
          type: boolean
        is_valid:
          type: boolean
        condition_description:
          type: string
        message:
          type: string
    DiscountConditionOperatorsResponse:
      type: object
      required:
        - operators
      properties:
        operators:
          type: array
          items:
            type: string
    DiscountConditionStatistics:
      type: object
      required:
        - total
        - active
        - inactive
        - by_type
        - by_operator
      properties:
        total:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        inactive:
          type: integer
          format: int64
        by_type:
          type: object
          additionalProperties:
            type: integer
            format: int64
        by_operator:
          type: object
          additionalProperties:
            type: integer
            format: int64
    CampaignClickCreate:
      type: object
      required:
        - campaign_id
        - click_type
      properties:
        campaign_id:
          type: integer
          format: int64
        session_id:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        click_type:
          type: string
          enum:
            - cta
            - banner
            - link
            - button
            - image
        clicked_url:
          type: string
          nullable: true
        customer_id:
          type: integer
          format: int64
          nullable: true
        clicked_at:
          type: string
          format: date-time
          nullable: true
        referer:
          type: string
          nullable: true
        device_type:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        utm_term:
          type: string
          nullable: true
        utm_content:
          type: string
          nullable: true
        conversion_value:
          type: number
          format: float
          nullable: true
        is_converted:
          type: boolean
          nullable: true
        conversion_data:
          type: object
          nullable: true
    CampaignClickUpdate:
      type: object
      properties:
        campaign_id:
          type: integer
          format: int64
        session_id:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        click_type:
          type: string
          nullable: true
          enum:
            - cta
            - banner
            - link
            - button
            - image
        clicked_url:
          type: string
          nullable: true
        customer_id:
          type: integer
          format: int64
          nullable: true
        clicked_at:
          type: string
          format: date-time
          nullable: true
        referer:
          type: string
          nullable: true
        device_type:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        utm_term:
          type: string
          nullable: true
        utm_content:
          type: string
          nullable: true
        conversion_value:
          type: number
          format: float
          nullable: true
        is_converted:
          type: boolean
          nullable: true
        conversion_data:
          type: object
          nullable: true
