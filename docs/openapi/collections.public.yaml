openapi: 3.1.0
info:
  title: Public Collections API
  version: 1.0.0
  description: |
    OpenAPI schema describing the unauthenticated collection discovery endpoints
    exposed under the `/collections` path in the storefront. The schema is kept
    intentionally narrow so that tests can validate that the transport shape is
    stable even as business logic evolves.
servers: []
paths:
  /collections/api/search:
    get:
      operationId: listCollections
      summary: Retrieve collections with optional filtering
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: display_type
          in: query
          required: false
          schema:
            type: string
        - name: has_products
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A paginated slice of public collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
  /collections/api/by-type/{type}:
    get:
      operationId: listCollectionsByType
      summary: Retrieve collections filtered by merchandising type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [automatic, manual]
      responses:
        '200':
          description: Collections filtered by type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
  /collections/api/with-products:
    get:
      operationId: listCollectionsWithProducts
      summary: Retrieve collections that currently have products
      responses:
        '200':
          description: Collections containing at least one product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
  /collections/api/popular:
    get:
      operationId: listPopularCollections
      summary: Retrieve popular collections
      responses:
        '200':
          description: Collections ranked by popularity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
  /collections/api/statistics:
    get:
      operationId: showCollectionStatistics
      summary: Retrieve aggregate counters summarising collection health
      responses:
        '200':
          description: Aggregated collection statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatisticsResponse'
  /collections/{collection}/products:
    get:
      operationId: listCollectionProducts
      summary: Retrieve the visible products assigned to a collection
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: brand_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: price_min
          in: query
          required: false
          schema:
            type: number
        - name: price_max
          in: query
          required: false
          schema:
            type: number
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Products within the collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionProductsResponse'
        '404':
          description: The requested collection is hidden or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CollectionSummary:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - is_visible
        - is_automatic
        - display_type
        - products_count
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        is_visible:
          type: boolean
        is_automatic:
          type: boolean
        display_type:
          type: [string, 'null']
        products_count:
          type: integer
          format: int64
          minimum: 0
    CollectionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSummary'
    CollectionStatisticsResponse:
      type: object
      required:
        - total_collections
        - visible_collections
        - automatic_collections
        - manual_collections
        - collections_with_products
        - collections_without_products
      properties:
        total_collections:
          type: integer
          format: int64
          minimum: 0
        visible_collections:
          type: integer
          format: int64
          minimum: 0
        automatic_collections:
          type: integer
          format: int64
          minimum: 0
        manual_collections:
          type: integer
          format: int64
          minimum: 0
        collections_with_products:
          type: integer
          format: int64
          minimum: 0
        collections_without_products:
          type: integer
          format: int64
          minimum: 0
    ProductSummary:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - brand
        - categories
        - media
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        brand:
          type: [string, 'null']
        categories:
          type: array
          items:
            type: string
        media:
          type: array
          items:
            type: string
    CollectionProductsResponse:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        links:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          required:
            - current_page
            - last_page
            - per_page
            - total
          properties:
            current_page:
              type: integer
              minimum: 1
            last_page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
